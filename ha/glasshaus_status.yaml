# =============================================================================
# GlassHaus tank STATUS + assignment helpers  (Home Assistant PACKAGE)
# =============================================================================
# Install: <config>/packages/glasshaus_status.yaml (packages already enabled), restart HA.
#
# ⚠️ These helpers ALREADY EXIST in your HA config (created earlier via the UI).
# Package + UI-created helpers with the SAME entity_id COLLIDE. So BEFORE installing:
#   Delete the old UI helpers (Settings → Devices & Services → Helpers) for:
#     tank_1/2/3_status, tank_1/2/3_tilt, tank_1/2/3_batch,
#     tank_1/2/3_last_cleaned, tank_1/2/3_expected_fg
#   OR only move the ones you want version-controlled. This file version-controls
#   them so restarts DON'T wipe edits (e.g. the 'Cold Crashing' status option that
#   got reverted when the API set_options was lost on restart).
#
# NOTE: batch options are AUTO-SYNCED by the app from Brewfather (useSyncBatchOptions),
# so the batch helper's options here are just a seed — the app overwrites them live.
# =============================================================================

input_select:
  tank_1_status: &status_opts
    name: Tank 1 Status
    icon: mdi:state-machine
    options:
      - "Ready"
      - "Fermenting"
      - "Cold Crashing"
      - "Dirty"
  tank_2_status:
    <<: *status_opts
    name: Tank 2 Status
  tank_3_status:
    <<: *status_opts
    name: Tank 3 Status

  tank_1_tilt: &tilt_opts
    name: Tank 1 Tilt
    icon: mdi:thermometer
    # OWNED Tilts first (Black/Red/Orange/Purple — Black & Purple are Pros), then the rest
    # of the Tilt color set for future-proofing. NOTE: a package input_select re-asserts
    # this list on every HA restart, so THIS is the source of truth — a runtime set_options
    # only lasts until the next reload. (Live HA was stale at [None,Black,Red,Blue] before
    # this; that was an un-reloaded old config, not what's declared here.)
    options: ["None", "Black", "Red", "Orange", "Purple", "Blue", "Green", "Yellow", "Pink"]
  tank_2_tilt:
    <<: *tilt_opts
    name: Tank 2 Tilt
  tank_3_tilt:
    <<: *tilt_opts
    name: Tank 3 Tilt

  # TEMP CONTROL SOURCE — which sensor the programs runner drives the setpoint off.
  #   Probe (default): command the setpoint straight (ITC-308 holds its thermowell probe).
  #   Tilt: shallow-fill correction — the runner shifts the commanded setpoint by
  #     (probe − Tilt) so the ITC-308 holds the BEER (Tilt, floating in the liquid) at the
  #     program's intended temp, not a barely-submerged probe. Guarded: only applies when
  #     the Tilt is fresh + the offset is within ±4°F; else falls back to Probe.
  tank_1_temp_source: &tsrc
    name: Tank 1 Temp Source
    icon: mdi:thermometer-check
    options: ["Probe", "Tilt"]
  tank_2_temp_source:
    <<: *tsrc
    name: Tank 2 Temp Source
  tank_3_temp_source:
    <<: *tsrc
    name: Tank 3 Temp Source

  # NOTE: tank_N_batch is NOT an input_select — see input_text below. A package
  # input_select re-asserts its hardcoded `options:` on every HA restart, which
  # forced the saved selection to reset when the selected batch wasn't in that
  # static seed → the "tanks lose their batch on reboot" bug. Batch is dynamic
  # (any beer, any tank, yearly repeats), so it's stored as FREE TEXT instead.

# Batch assignment = the Brewfather batch NUMBER as free text. No options list, so
# HA can never reset it on restart. The app's picker builds the choosable beers
# live from Brewfather (Fermenting + Conditioning) and writes the chosen number;
# display resolves the number back to the live batch. Empty = unassigned.
input_text:
  tank_1_batch: &batch_txt
    name: Tank 1 Batch
    icon: mdi:glass-mug-variant
    max: 32
  tank_2_batch:
    <<: *batch_txt
    name: Tank 2 Batch
  tank_3_batch:
    <<: *batch_txt
    name: Tank 3 Batch

  # Tilt-control status note, written by the runner. Empty in normal Tilt/Probe control;
  # set to "held: …" / "decaying: …" when the Tilt goes unresponsive in Tilt mode so the
  # health platform + app can WARN you (the beer-safety failure the brewer flagged).
  tank_1_temp_ctl_note: &tcn
    name: Tank 1 Temp Ctl Note
    icon: mdi:thermometer-alert
    max: 80
  tank_2_temp_ctl_note:
    <<: *tcn
    name: Tank 2 Temp Ctl Note
  tank_3_temp_ctl_note:
    <<: *tcn
    name: Tank 3 Temp Ctl Note

input_number:
  # Persisted Tilt-vs-probe offset (°F) per tank — the runner's last-good compensation.
  # Survives HA/container restarts + rides through Tilt gaps so control never snaps.
  tank_1_temp_offset: &toff
    name: Tank 1 Temp Offset
    icon: mdi:thermometer-lines
    min: -6
    max: 6
    step: 0.1
    mode: box
  tank_2_temp_offset:
    <<: *toff
    name: Tank 2 Temp Offset
  tank_3_temp_offset:
    <<: *toff
    name: Tank 3 Temp Offset

  tank_1_expected_fg: &fg
    name: Tank 1 Expected FG
    icon: mdi:target
    min: 0.990
    max: 1.030
    step: 0.001
    mode: box
  tank_2_expected_fg:
    <<: *fg
    name: Tank 2 Expected FG
  tank_3_expected_fg:
    <<: *fg
    name: Tank 3 Expected FG

input_datetime:
  tank_1_last_cleaned: &cleaned
    name: Tank 1 Last Cleaned
    has_date: true
    has_time: false
  tank_2_last_cleaned:
    <<: *cleaned
    name: Tank 2 Last Cleaned
  tank_3_last_cleaned:
    <<: *cleaned
    name: Tank 3 Last Cleaned
